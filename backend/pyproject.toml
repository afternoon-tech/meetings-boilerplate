[project]
name = "meetings-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.120.0,<0.121.0",
    "sqlalchemy[asyncio]>=2.0.43,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pydantic>=2.11.7,<2.12.0",
    "pydantic-settings>=2.10.1,<2.11.0",
    "uvicorn>=0.35.0,<0.36.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "mypy>=1.17.1,<1.18.0",
    "pytest>=8.4.1,<8.5.0",
    "pytest-asyncio>=1.1.0,<1.2.0",
    "ruff>=0.12.8,<0.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "F", "ISC", "FAST", "ASYNC", "B"]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
